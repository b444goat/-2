<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ШАШКИ 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--fg:#c9b8a6;--bg:#000;--accent:#7a0f0f;--bl:.35px;--hue:0deg}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:var(--fg);touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:contrast(1.08) saturate(calc(.78*var(--sm,1))) sepia(.16) blur(var(--bl)) hue-rotate(var(--hue)) brightness(var(--brt,1));transition:filter .2s}
.vig{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%);box-shadow:inset 0 0 30px 6px rgba(0,0,0,.35)}
.scan{position:fixed;inset:0;z-index:6;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.08) 3px);animation:fl 5s infinite}
.scan::after{content:'';position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(to bottom,transparent,rgba(200,190,170,.05),transparent);animation:roll 7s linear infinite}
#noise{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.08;mix-blend-mode:overlay;background-size:192px 192px;image-rendering:pixelated}
@keyframes roll{to{top:130%}}@keyframes fl{0%,100%{opacity:1}47%{opacity:.9}50%{opacity:.75}53%{opacity:.95}}
#tun{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity 1.2s;background:radial-gradient(ellipse at center,transparent 18%,rgba(0,0,0,.92) 75%)}
#hb{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(ellipse at center,transparent 40%,rgba(160,0,0,.75) 100%)}
#fl,#dk{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;transition:opacity .4s}#fl{background:#a00}
#dk{background:#000;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center;justify-content:center;letter-spacing:.3em;z-index:16}#dk small{font-size:13px;letter-spacing:.1em;opacity:.7;max-width:80%}
#wipe{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:#000}
#cut{position:fixed;inset:0;z-index:41;pointer-events:none;opacity:0;transition:opacity .7s;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;letter-spacing:.25em;font-size:20px;line-height:1.7;color:#d8c8b4}
#cut.big{font-size:clamp(28px,8vw,52px);letter-spacing:.3em;color:#c01818}#cut small{display:block;font-size:15px;letter-spacing:.2em;color:#c9b8a6;margin-top:14px}
#cut.end{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(28px,8vw,52px);letter-spacing:.3em;color:#c01818}
#cut.thanks{font-family:'PT Mono','Courier New',monospace;font-size:16px;line-height:2.1;letter-spacing:.12em;color:#cfc4b4;text-shadow:0 0 6px rgba(0,0,0,.9)}
#cut.thanks_{font-size:17px;letter-spacing:.08em;max-width:460px;margin:0 auto;color:#d8c8b4}
.hang{position:fixed;inset:0;z-index:60;background:#000}
body.hit canvas{filter:contrast(1.4) saturate(2) sepia(.6) hue-rotate(-30deg) blur(1px)}body.hit #fl{opacity:.35!important}
#intro{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
#il,#il *{color:#fff!important}#il{opacity:0;transition:opacity 1s;max-width:380px;line-height:1.7;letter-spacing:.12em}#il img{width:190px;display:block;margin:0 auto 16px}#il button{margin-top:6px}
button{pointer-events:auto;background:rgba(20,5,5,.7);color:var(--fg);border:1px solid var(--accent);padding:12px 22px;font:inherit;letter-spacing:.1em;border-radius:13px;min-height:40px;cursor:pointer}
button:active{background:var(--accent)}
#start,#set,#notes,#dsel{position:fixed;inset:0;display:flex;justify-content:center;text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);box-sizing:border-box}
#start{z-index:20;background:rgba(0,0,0,.6);align-items:flex-start}#set{z-index:25;background:#000;display:none}#dsel{z-index:25;background:#000;display:none}#dsel h2{font-weight:400;letter-spacing:.3em}#notes{z-index:25;background:#0a0606;display:none}
.mm{margin:auto;width:100%;max-width:440px}
#start h1{font-weight:400;letter-spacing:.3em;font-size:clamp(26px,8vw,44px);margin:0 0 14px}
/*beta*/.beta{display:inline-block;letter-spacing:.5em;font-size:12px;color:#ff5a4a;border:1px solid #7a0f0f;padding:3px 3px 3px 10px;margin:-6px 0 14px}body.light .beta{color:#a8431c;border-color:#a8742e}
#start p,.nhint{opacity:.7;font-size:14px;margin:6px 0}.nhint.small{font-size:12px;opacity:.55}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.dif{padding:8px 12px;font-size:13px}.dif.on{background:var(--accent)}
.col{display:flex;flex-direction:column;gap:10px;margin-top:18px;align-items:center}.col button{min-width:230px}
#rules{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.93);align-items:center;justify-content:center;text-align:left;padding:24px;box-sizing:border-box;font-size:14px;line-height:1.7}#rules>div{max-width:340px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(122,15,15,.45);font-size:15px;text-align:left}
.seg{display:flex}.seg button{padding:8px 10px;font-size:13px}.seg button.on{background:var(--accent)}.flags button{padding:6px 8px;opacity:.55}.flags button.on{opacity:1;background:var(--accent)}.flags svg{display:block}
input[type=range]{width:150px;accent-color:#a11}
#set h2,#notes h2{font-weight:400;letter-spacing:.3em;margin:0 0 12px}#sback,#sreset{margin-top:14px}.dng{border-color:#d00;color:#ff5a4a}
.glowb{border-color:#e8b04a!important;color:#ffe3a0;box-shadow:0 0 14px #e8b04a88;animation:gl 1.6s infinite}@keyframes gl{50%{box-shadow:0 0 26px #e8b04acc}}
.ncount{font-size:18px;letter-spacing:.15em}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.ntile{position:relative;padding:0;min-height:56px;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.ntile i{font-style:normal;font-size:13px;opacity:.8}
.ntile.got{background:#2a1a10;border-color:#e8b04a;color:#f2e8cf}.ntile.no{opacity:.45}.ntile.lock{border-style:dashed;border-color:#6a6a8a}
#nread{display:none;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.82);align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
.paper{position:relative;max-width:420px;width:100%;max-height:86vh;overflow:auto;background:#efe3c4 repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(80,60,40,.18) 32px);color:#2a2018;padding:30px 26px 34px;box-sizing:border-box;box-shadow:0 8px 40px #000,inset 0 0 40px rgba(120,90,50,.35);transform:rotate(-1.2deg);line-height:32px;font-size:21px;text-align:left}
.paper .ntext{font-family:'Segoe Script','Bradley Hand','Noteworthy','Comic Sans MS','Marker Felt',cursive}
.paper.prec{background-color:#d9d2bf;font-size:19px}.paper.pdia{background-color:#cfc6b0;color:#3a1010;font-size:19px}.paper.pkid{background-color:#f4e6d0;color:#4a2a6a;font-size:23px}
.ntag{position:absolute;right:12px;bottom:6px;font-size:12px;opacity:.5;font-family:Georgia,serif;line-height:1}
#nread.open .paper{animation:unf .65s cubic-bezier(.2,.8,.3,1)}@keyframes unf{0%{transform:scale(.15,.05) rotate(14deg);opacity:0}45%{transform:scale(1,.12) rotate(4deg);opacity:1}100%{transform:scale(1,1) rotate(-1.2deg)}}
#hud{z-index:10;position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
#label{letter-spacing:.2em;text-transform:uppercase;font-size:13px;text-shadow:0 0 8px #000}
#rg{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:10;display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
.rgb{display:flex;flex-direction:column;gap:3px;min-width:110px}#rg2{align-items:flex-end}.rl{font-size:11px;letter-spacing:.25em;text-shadow:0 0 6px #000}
.pips{display:flex;gap:4px}#rg2 .pips{flex-direction:row-reverse}.pip{width:15px;height:15px;transform:rotate(45deg);border:1px solid #7a0f0f;background:rgba(0,0,0,.5);transition:all .3s}.pip.used{opacity:.25;border-style:dashed}.pip.on{background:#d21c14;box-shadow:0 0 10px #f33;border-color:#f66}
.bar{height:4px;background:rgba(0,0,0,.6);border:1px solid #4a0a0a;width:100%}.bar b{display:block;height:100%;width:0;background:#a01010;transition:width .3s}
.rgb.flash{animation:rf .3s 3}@keyframes rf{50%{filter:brightness(2.5);transform:scale(1.12)}}
#sc{position:fixed;top:calc(env(safe-area-inset-top,0px) + 40px);left:0;right:0;text-align:center;z-index:9;opacity:0;font-size:20px;letter-spacing:.3em;pointer-events:none;text-shadow:0 0 8px #000}
#sub.mid{bottom:auto;top:50%;transform:translateY(-50%);font-size:clamp(26px,7vw,44px);line-height:1.5;padding:0 24px;transition:opacity 1.4s}
#sub{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);text-align:center;z-index:9;pointer-events:none;opacity:0;transition:opacity .3s;font-size:19px;letter-spacing:.12em;text-shadow:0 0 10px #000,0 2px 2px #000;padding:0 16px}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);text-align:center;z-index:9;pointer-events:none;opacity:0;transition:opacity .4s;font-size:15px;letter-spacing:.1em;padding:0 20px;text-shadow:0 0 8px #000;color:#f2e2c0}
#tm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;z-index:9;pointer-events:none;font-size:30px;letter-spacing:.2em;text-shadow:0 0 10px #000;opacity:0;transition:opacity .3s}
#bubbles{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:12;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.bub{max-width:min(86vw,420px);padding:11px 16px;border-radius:18px;font-size:16px;line-height:1.4;background:rgba(255,248,230,.94);color:#3a2616;box-shadow:0 4px 18px rgba(0,0,0,.45);opacity:0;transform:translateY(14px) scale(.9);transition:all .45s cubic-bezier(.2,1.2,.4,1)}
.bub.me{background:rgba(60,40,24,.92);color:#f2e2c0}.bub.in{opacity:1;transform:none}.bub.out{opacity:0;transform:translateY(-10px) scale(.95)}
#skip{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:12;display:none;font-size:12px;padding:6px 12px;min-height:0;opacity:.7}
#swp{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);z-index:13;display:none;opacity:0;transition:opacity .3s;pointer-events:none;background:rgba(20,5,5,.7);border:1px solid #d21c14;border-radius:13px;padding:10px 22px;white-space:nowrap;animation:gl 1.2s infinite;line-height:1}
#swp i{display:inline-block;font-style:normal;font-size:38px;font-weight:700;color:#ffb0a0;margin:0 3px;will-change:transform,opacity}
#swp i:nth-child(2){animation-delay:.16s}#swp i:nth-child(3){animation-delay:.32s}
@keyframes swc{0%{transform:translateX(16px);opacity:0}25%{opacity:1}100%{transform:translateX(-18px);opacity:0}}
#shot{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);z-index:12;display:none;font-size:18px;padding:16px 34px;border-color:#d21c14;color:#ffb0a0;animation:gl 1.2s infinite}
#adm{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.93);flex-wrap:wrap;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 20px;align-content:flex-start;overflow:auto}#adm button{font-size:13px;padding:10px 12px}
/* светлое меню первого запуска */
body.light{--fg:#4a3420;--accent:#a8742e}body.light .vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(60,35,10,.35) 100%);box-shadow:none}body.light .scan{display:none}
body.light canvas{filter:contrast(1.02) saturate(var(--sm,1)) sepia(.08) blur(var(--bl)) brightness(var(--brt,1))}
body.light #start{background:rgba(255,244,214,.38)}body.light button{background:rgba(255,246,222,.85);color:#4a3420}body.light .dif.on,body.light button:active{background:#e8c27a}
body.light #start h1,body.light #start p{color:#3a2616;text-shadow:0 1px 0 #fff8}
.nm canvas{filter:sepia(1) saturate(7) hue-rotate(-42deg) contrast(1.25) brightness(.9)!important}.nm .vig{background:radial-gradient(ellipse at center,rgba(60,0,0,.2) 20%,rgba(80,0,0,.95) 100%)}.nm #label,.nm #tm{color:#ff5a4a}
.nofx canvas{filter:brightness(var(--ibr,1)) blur(var(--ibl,0px)) saturate(var(--sm,1))}.nofx .scan,.nofx #noise,.nofx .vig{display:none}
@media (max-height:520px){.col{margin-top:10px;gap:6px;flex-direction:row;flex-wrap:wrap;justify-content:center}.col button,button{padding:8px 16px}.col button{min-width:0}.srow{padding:4px 0}}
</style></head><body>

<div id='mmain'><h1 data-i='title'></h1><div class='beta'>BETA</div><div class='col'><button id='bs' data-i='story'></button><button id='bn' style='display:none'></button><button id='be' data-i='endless'></button><button id='b2' data-i='two'></button><button id='nb' data-i='notes' style='display:none'></button><button id='bd' data-i='diffLbl'></button><button id='bset' data-i='settings'></button><button id='rb' data-i='rulesBtn'></button></div></div>

/* ===== ПРАВИЛА (чистая логика) ===== */
/* 0 пусто, 1 моя, 2 чужая, 3 моя дамка, 4 чужая дамка, 9 дыра */
const own=v=>v&&v<9?(v==1||v==3?1:2):0;
const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const KR=3; /* дальность дамки */
function dirs(v){return v>2?[[1,1],[1,-1],[-1,1],[-1,-1]]:(own(v)==1?[[-1,1],[-1,-1]]:[[1,1],[1,-1]])}
function jumpsK(b,r,c,v,path,caps,out){
  let f=false;const K=v>2;
  for(const[dr,dc]of dirs(v)){
    let mr=r+dr,mc=c+dc,d=1;
    if(K)while(d<KR-1&&inb(mr,mc)&&!b[mr][mc]){mr+=dr;mc+=dc;d++}
    if(!inb(mr,mc)||!b[mr][mc]||b[mr][mc]>8||own(b[mr][mc])==own(v)||caps.some(x=>x[0]==mr&&x[1]==mc))continue;
    let tr=mr+dr,tc=mc+dc,td=d+1;
    while(inb(tr,tc)&&!b[tr][tc]&&td<=(K?KR:2)){
      f=true;
      const np=path.concat([[tr,tc]]),ncp=caps.concat([[mr,mc]]);
      if(!K&&tr==(own(v)==1?0:7))out.push({path:np,caps:ncp});else jumpsK(b,tr,tc,v,np,ncp,out);
      if(!K)break;
      tr+=dr;tc+=dc;td++;
    }
  }
  if(!f&&caps.length)out.push({path,caps});
}
let FORCE=true;
function moves(b,s){
  const J=[],M=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const v=b[r][c];if(own(v)!=s)continue;
    b[r][c]=0;jumpsK(b,r,c,v,[[r,c]],[],J);b[r][c]=v;
    for(const[dr,dc]of dirs(v)){let tr=r+dr,tc=c+dc,st=1;while(inb(tr,tc)&&!b[tr][tc]&&st<=KR){M.push({path:[[r,c],[tr,tc]],caps:[]});if(v<3)break;tr+=dr;tc+=dc;st++}}
  }
  return (J.length&&FORCE)?J:J.concat(M);
}
function apply(b,m){
  const n=b.map(x=>x.slice()),[r0,c0]=m.path[0],[r1,c1]=m.path[m.path.length-1];
  let v=n[r0][c0];n[r0][c0]=0;
  m.caps.forEach(([r,c])=>n[r][c]=0);
  if(v<3&&r1==(own(v)==1?0:7))v+=2;
  n[r1][c1]=v;return n;
}
function ev(b){let s=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const v=b[r][c];if(!v||v>8)continue;const o=own(v),x=v>2?160:100+(o==2?r:7-r)*4;s+=o==2?x:-x}return s}
function mm(b,d,a,be,s){
  const ms=moves(b,s);
  if(!d||!ms.length)return ms.length?ev(b):(s==2?-9999-d:9999+d);
  if(s==2){let best=-1e9;for(const m of ms){best=Math.max(best,mm(apply(b,m),d-1,a,be,1));a=Math.max(a,best);if(a>=be)break}return best}
  let best=1e9;for(const m of ms){best=Math.min(best,mm(apply(b,m),d-1,a,be,2));be=Math.min(be,best);if(a>=be)break}return best;
}
/* ИИ играет за сторону 2. noise — случайность оценки (лёгкий уровень) */
function aiPick(b,depth,noise){
  let bs=-1e9,bm=null;
  const heavy=b.flat().filter(v=>v>2&&v<9).length;
  for(const m of moves(b,2)){
    const sc=mm(apply(b,m),Math.min(depth,heavy?3:9),-1e9,1e9,1)+Math.random()*noise;
    if(sc>bs){bs=sc;bm=m}
  }
  return bm;
}
/* пробитие: можно ли разбить клетку */
const canBreak=(b,r,c)=>inb(r,c)&&(r+c)%2==1&&(b[r][c]==0||b[r][c]==1||b[r][c]==2);
/* заряды ярости: за каждую per-ю потерянную шашку, пока остаётся >=3, максимум 3 за партию */
function newRage(per){return{per:per||3,lost:0,earned:0,ch:0}}
function rageLoss(R,n,remaining){
  /* n — сколько шашек потеряно сейчас, remaining — сколько осталось после */
  let gained=0;
  for(let i=0;i<n;i++){
    R.lost++;const left=remaining+(n-1-i);
    if(R.lost%R.per==0&&left>=3&&R.earned<3){R.earned++;R.ch++;gained++}
  }
  return gained;
}
const countSide=(b,s)=>{let n=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(own(b[r][c])==s)n++;return n};
function startBoard(){const B=[];for(let r=0;r<8;r++){B.push([]);for(let c=0;c<8;c++)B[r].push((r+c)%2?(r<3?2:r>4?1:0):0)}return B}

      if(nz||pl){const d=nz?0.12:0.07,s=o.createBufferSource();s.buffer=nb;const g=o.createGain();env(g,t,d,pl?1:0.7);g.connect(o.destination);bp(s,nz?('сцчщsczx'.includes(ch)?5000:2800):1800,1.8,g,1);s.start(t);s.stop(t+d);t+=d}

function beatSnd(vol){
  if(!AC)return;const v=vol==null?0.5:vol,t0=AC.currentTime+0.01;
  /* «тук-тум»: два мягких глухих удара, как сердце через грудную клетку */
  const thump=(t,f0,f1,amp,len)=>{
    const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
    o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+len*0.8);
    lp.type='lowpass';lp.frequency.value=180;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(amp,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+len+0.05);
    /* мягкий шум-удар сверху для «плоти» */
    const n=AC.createBufferSource();n.buffer=nzb;const nf=AC.createBiquadFilter();nf.type='lowpass';nf.frequency.value=260;const ng=AC.createGain();
    ng.gain.setValueAtTime(amp*0.5,t);ng.gain.exponentialRampToValueAtTime(0.0001,t+len*0.6);n.connect(nf);nf.connect(ng);ng.connect(master);n.start(t);n.stop(t+len*0.6+0.02);
  };
  thump(t0,78,40,v*1.0,0.17);
  thump(t0+0.27,66,38,v*0.62,0.13);
}

async function handMove(m,s){
  const g=gen,A=armFor(s),path=m.path,[r0,c0]=path[0];
  const king=B[r0][c0]>2,hy=l=>TOP+0.14+(king?0.056:0)+l;
  const P0=cp(r0,c0);
  await A.to(P0.x,hy(0.28),P0.z,0.42,0.08);if(g!=gen)return;
  await A.to(P0.x,hy(0),P0.z,0.15);if(g!=gen)return;
  A.grip(1);await tw(0.1,()=>{});if(g!=gen)return;
  const carry=new THREE.Group(),meshes=pg.children.filter(o=>o.userData.r==r0&&o.userData.c==c0);
  meshes.forEach(o=>{pg.remove(o);o.position.x-=P0.x;o.position.z-=P0.z;carry.add(o)});
  carry.position.set(P0.x,0,P0.z);pg.add(carry);
  const follow=(x,z,l)=>{carry.position.set(x,l,z);A.x=x;A.y=hy(l);A.z=z;A.upd()};
  let px=P0.x,pz=P0.z;
  await tw(0.18,k=>{follow(px,pz,0.1*k)});
  for(let i=1;i<path.length;i++){
    const Pi=cp(path[i][0],path[i][1]),x0=px,z0=pz,dist=Math.hypot(Pi.x-x0,Pi.z-z0),capped=!!m.caps[i-1];
    await tw(0.22+dist*0.8,k=>follow(x0+(Pi.x-x0)*k,z0+(Pi.z-z0)*k,0.1+Math.sin(k*Math.PI)*(capped?0.16:0.06)));
    if(g!=gen)return;
    px=Pi.x;pz=Pi.z;
    if(capped){const cc=m.caps[i-1];popPiece(cc[0],cc[1]);sfx(1)}
  }
  await tw(0.16,k=>follow(px,pz,0.1*(1-k)));
  A.grip(0);sfxPlace();
  A.to(A.o.rest[0],A.o.rest[1],A.o.rest[2],0.6);
}
function popPiece(r,c){
  const ms=pg.children.filter(o=>o.userData.r==r&&o.userData.c==c);
  tw(0.28,k=>{ms.forEach(o=>{o.scale.setScalar(Math.max(0.001,1-k));o.position.y+=0.01})});
}
async function doMove(m,s){
  const g=gen,[r0,c0]=m.path[0],[r1,c1]=m.path[m.path.length-1],was=B[r0][c0];
  await handMove(m,s);if(g!=gen)return false;
  mvBL(m);const promo=was<3&&apply(B,m)[r1][c1]>2;B=apply(B,m);sync();hl.clear();
  quiet=(m.caps.length||promo||was<3)?0:quiet+1;
  if(m.caps.length){sfx(m.caps.length);rageHit(3-s,m.caps.length);progress()}
  /* записки */
  if(humanSide(s)&&noteCells.length&&(s==1)){
    for(const[r,c]of m.path){const n=noteAt(r,c);if(n){removeNoteCell(n);sync();await collectNote(n.id);if(g!=gen)return false}}
  }
  if(promo&&loc=='cot'&&mode=='two')sfxMeow();
  await evt('moved',{m,s,was,promo,caps:m.caps.length});
  return g==gen;
}

function aiPickBreak(){
  const P=[],E=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){if(!canBreakCell(r,c))continue;const v=B[r][c];if(v==1)P.push([r,c,7-r]);else if(v==0)E.push([r,c])}
  if(P.length&&Math.random()<0.8){P.sort((a,b)=>b[2]-a[2]);return P[Math.min(P.length-1,Math.random()*2|0)]}
  const near=E.filter(([r,c])=>[[1,1],[1,-1],[-1,1],[-1,-1]].some(([dr,dc])=>inb(r+dr,c+dc)&&B[r+dr][c+dc]==1));
  const L=near.length?near:E;return L.length?pick(L):null;
}

/* ---- пробитие клетки железкой ---- */
const AIM_T=2.6,WIND_T=0.35,CHARGE_T=AIM_T+WIND_T; /* прицеливание + замах; весь пробой ≈ 4.5 с */
function toolHand(A){const t=tool,th=t.rotation.z,ph=t.rotation.y;A.x=t.position.x+0.5*(-Math.sin(th)*Math.cos(ph));A.y=t.position.y+0.5*Math.cos(th)+0.05;A.z=t.position.z+0.5*(Math.sin(th)*Math.sin(ph));A.upd()}
const toolGripAt=()=>{const th=tool.rotation.z,ph=tool.rotation.y;return{x:tool.position.x+0.5*(-Math.sin(th)*Math.cos(ph)),y:tool.position.y+0.5*Math.cos(th)+0.05,z:tool.position.z+0.5*(Math.sin(th)*Math.sin(ph))}}
let flashEl;
async function punchSeq(s,r,c,ctl){
  /* ctl: {cancel:()=>bool} — для игрока, пока палец зажат; для ИИ null */
  const g=gen,A=armFor(s),P=cp(r,c),R=rage[s];
  busy=true;legal=[];hl.clear();sel=null;
  const cancelled=()=>ctl&&ctl.cancel();
  /* взять железку */
  const gp=toolGripAt();
  await A.to(gp.x,gp.y+0.2,gp.z,0.3,0.12);if(g!=gen)return false;
  await A.to(gp.x,gp.y,gp.z,0.1);if(g!=gen)return false;
  if(cancelled()){await A.rest(0.4);busy=false;if(humanSide(s))startHuman();return false}
  A.grip(1);
  /* поднять и перенести к клетке */
  const rx=tool.position.x,rz=tool.position.z,ry0=TOOL_REST.ry;
  const hoverY=TOP+0.3;
  await tw(0.45,k=>{
    tool.position.set(rx+(P.x-rx)*k,TOOL_REST.y+(hoverY-TOOL_REST.y)*k+Math.sin(k*Math.PI)*0.2,rz+(P.z-rz)*k);
    tool.rotation.set(0,ry0*(1-k),-Math.PI/2*(1-k));toolHand(A);
  });
  if(g!=gen)return false;
  /* накопление */
  glow.position.set(P.x,TOP+0.047,P.z);glow.visible=true;glowMat.opacity=0.05;chargeL.position.set(P.x,TOP+0.5,P.z);
  const stop=sfxCharge(CHARGE_T);let ok=true;
  evt('chargeStart',{s,r,c});
  const bobN=2.5; /* «вверх-вниз» над клеткой — прицеливается */
  await tw(CHARGE_T,(k)=>{
    if(g!=gen){return false}
    if(cancelled()){ok=false;return false}
    const t=k*CHARGE_T,ka=Math.min(1,t/AIM_T);
    glowMat.opacity=0.08+0.85*k*k;glowMat.color.setRGB(0.6+0.4*k,0.05+0.12*k,0.03);
    chargeL.intensity=0.2+2.8*k*k;
    let y,dx=0,dz=0;
    if(t<AIM_T){
      const ph=ka*bobN*Math.PI*2,amp=0.055*(1-0.35*ka);
      y=hoverY-0.02*ka+Math.sin(ph)*amp*Math.min(1,ka*6); /* небольшие покачивания вниз-вверх */
      const j=0.004*(1-ka)+0.002;dx=(Math.random()-0.5)*j;dz=(Math.random()-0.5)*j;
      shake=Math.max(shake,0.12+0.3*ka);
    }else{
      const w=(t-AIM_T)/WIND_T,e=1-Math.pow(1-w,3); /* резкий замах вверх */
      y=hoverY-0.02+(0.62)*e;shake=Math.max(shake,0.5+0.3*w);
    }
    tool.position.set(P.x+dx,y,P.z+dz);
    toolHand(A);
  },x=>x);
  if(g!=gen){stop();return false}
  if(!ok){
    stop();glow.visible=false;chargeL.intensity=0;
    await returnTool(A,P);busy=false;if(humanSide(s)&&g==gen)startHuman();return false;
  }
  stop();
  /* удар */
  await tw(0.09,k=>{const y0=hoverY+0.6;tool.position.set(P.x,y0*(1-k)+(TOP+0.03)*k,P.z);toolHand(A)},x=>x*x*x);
  if(g!=gen)return false;
  sfxShot();shake=2.2;imp=1.6;flashScreen(0.55,160);
  glow.visible=false;chargeL.intensity=0;
  R.ch--;
  const victimV=B[r][c];
  B[r][c]=9;BL[r][c]=0;HO.push([r,c]);holeVis(r,c);quiet=0;
  sync();hudRage();
  if(victimV==1||victimV==2){const side=own(victimV);rageHit(side,1)}
  await returnTool(A,P);
  if(g!=gen)return false;
  await evt('punched',{s,r,c});
  return g==gen;
}
async function returnTool(A,P){
  const x0=tool.position.x,y0=tool.position.y,z0=tool.position.z;
  await tw(0.45,k=>{
    tool.position.set(x0+(TOOL_REST.x-x0)*k,y0+(TOOL_REST.y-y0)*k+Math.sin(k*Math.PI)*0.15,z0+(TOOL_REST.z-z0)*k);
    tool.rotation.set(0,TOOL_REST.ry*k,-Math.PI/2*k);
    toolHand(A);
  });
  A.grip(0);A.to(A.o.rest[0],A.o.rest[1],A.o.rest[2],0.6);
}

    [...w].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;s.style.display='inline-block';

/* ===== КАМЕРА-КАТСЦЕНЫ ===== */
let camCtl=null,camLast={pos:V3(0,2,2),look:V3(0,1,0)};
function camGo(pos,look,dur,roll){
  return new Promise(res=>{
    const up0=camCtl?camera.up.clone():V3(0,1,0).applyQuaternion(camera.quaternion); /* «верх» камеры сейчас — плавно переходит в обычный, без рывка поворота */
    const a={t:0,p0:[curPos.x,curPos.y,curPos.z],l0:[curLook.x,curLook.y,curLook.z],dur:Math.max(0.01,dur||1.5),done:false};
    if(camCtl&&camLast){a.p0=[camLast.pos.x,camLast.pos.y,camLast.pos.z];a.l0=[camLast.look.x,camLast.look.y,camLast.look.z]}
    camCtl=(T,dt)=>{
      a.t=Math.min(a.dur,a.t+dt);const k=ease(a.t/a.dur);
      const px=a.p0[0]+(pos[0]-a.p0[0])*k,py=a.p0[1]+(pos[1]-a.p0[1])*k,pz=a.p0[2]+(pos[2]-a.p0[2])*k;
      const lx=a.l0[0]+(look[0]-a.l0[0])*k,ly=a.l0[1]+(look[1]-a.l0[1])*k,lz=a.l0[2]+(look[2]-a.l0[2])*k;
      camera.position.set(px+(Math.random()-0.5)*shake*0.05,py+(Math.random()-0.5)*shake*0.05,pz);camera.up.lerpVectors(up0,V3(0,1,0),k).normalize();camera.lookAt(lx,ly,lz);
      if(roll)camera.rotateZ(roll*k);
      camLast.pos.set(px,py,pz);camLast.look.set(lx,ly,lz);
      if(a.t>=a.dur&&!a.done){a.done=true;res()}
    };
  });
}
function camRelease(){
  if(!camCtl)return;camCtl=null;camera.up.set(0,1,0);{const fb=innerWidth<innerHeight?72:58;if(camera.fov!=fb){camera.fov=fb;camera.updateProjectionMatrix()}}
  curPos.copy(camera.position);curLook.copy(camLast.look);curQ.copy(camera.quaternion);
}

    T_('звон в ушах',()=>false,v=>sfxTinnitus(v)),
    B_('«шум VHS» вкл/выкл',()=>{if(hiss)hiss.gain.value=hiss.gain.value>0?0:0.5}),
    B_('стол упал/поднят',()=>{tgtY=tgtY?0:-0.9}),
    B_('стереть дрожь/сброс fx',()=>{fxRoll=0;camDrop=0;shake=0;heartOn=false;document.documentElement.style.setProperty('--bl','0.35px');document.documentElement.style.setProperty('--hue','0deg');$('tun').style.opacity=0;$('fl').style.opacity=0;document.body.classList.remove('hit');camRelease()}),
    H_('РУКИ'),
    B_('показать мои',()=>ARMS.me.forEach(a=>a.show(true))),B_('скрыть все',()=>Object.keys(ARMS).forEach(k=>ARMS[k].forEach(a=>a.show(false)))),
    B_('железка на столе',()=>{toolRest()}),
    S_('качество графики (0-2)',0,2,1,()=>cfg.gfx,v=>{cfg.gfx=v;saveCfg();applyCfg()}),
  ]},
  {n:'Звук',items:()=>[
    H_('ЭФФЕКТЫ'),
    B_('удар (выстрел)',()=>sfxShot()),B_('накопление 3с',()=>sfxCharge(3)),B_('записка',()=>sfxPaper()),B_('укол',()=>sfxInject()),B_('мяу',()=>sfxMeow()),B_('шашка',()=>sfxPlace()),B_('взятие',()=>sfx(1)),B_('взятие x3',()=>sfx(3)),B_('сердце',()=>beatSnd(0.6)),B_('клик',()=>clickSnd()),
    H_('МУЗЫКА'),
    B_('подвал',()=>setMusic('den',1)),B_('туториал',()=>setMusic('tut',1)),B_('рай',()=>setMusic('heaven',1)),B_('тишина',()=>setMusic('none',0.5)),
    H_('ГОЛОС'),
    B_('монстр',()=>speak('ТЫ ПРИШЁЛ','mon')),B_('брат',()=>speak('Малой, садись','bro')),B_('человек',()=>speak('Малой!','human')),B_('девочка',()=>speak('Как ты себя чувствуешь?','girl')),
    S_('громкость музыки',0,1,0.05,()=>cfg.mvol,v=>{cfg.mvol=v;saveCfg();applyCfg()}),
    S_('громкость звуков',0,1.5,0.05,()=>cfg.vvol,v=>{cfg.vvol=v;saveCfg();applyCfg()}),
    I_(()=>'внешние файлы audio/: '+(typeof EXT!=='undefined'?(Object.keys(EXT).join(', ')||'нет — играют встроенные'):'?')),
  ]},
  {n:'Лог',items:()=>[
    B_('очистить',()=>{__LOG.length=0}),
    B_('копировать',()=>{try{navigator.clipboard.writeText(__LOG.join('\n'))}catch(e){}}),
    I_(()=>__LOG.length?__LOG.slice(-40).join('\n'):'ошибок нет'),
    I_(()=>'fps≈'+FPS.v+'  кадров '+(window.__frames||'-')+'  tween: '+TW.length),
  ]},
  ];
  /* fps */
  window.FPS={v:0};{let n=0,t0=performance.now();(function f(){n++;const t=performance.now();if(t-t0>=1000){FPS.v=n;n=0;t0=t}requestAnimationFrame(f)})()}
  /* ---- построение ---- */
  let cur=0,live=[];
  const tabs=P.querySelector('#modt'),box=P.querySelector('#modc');
  function build(){
    tabs.innerHTML='';TABS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.n;b.className=i==cur?'on':'';b.onclick=()=>{cur=i;build()};tabs.appendChild(b)});
    box.innerHTML='';live=[];
    TABS[cur].items().forEach(it=>{
      if(it.t=='h'){const h=document.createElement('h4');h.textContent=it.l;box.appendChild(h);return}
      if(it.t=='i'){const p=document.createElement('pre');box.appendChild(p);const u=()=>p.textContent=it.f();u();live.push(u);return}
      if(it.t=='pre'){const p=document.createElement('pre');p.id=it.id;box.appendChild(p);return}
      let row=box.lastChild;if(!row||!row.classList||!row.classList.contains('r')||!row.dataset.flow||it.t!='b'){row=document.createElement('div');row.className='r';box.appendChild(row);if(it.t=='b')row.dataset.flow=1}
      if(it.t=='b'){const b=document.createElement('button');b.textContent=it.l;if(it.cls)b.className=it.cls;b.onclick=run(it.f);row.appendChild(b)}
      if(it.t=='t'){const sp=document.createElement('span');sp.textContent=it.l;const b=document.createElement('button');const u=()=>{const v=!!it.g();b.textContent=v?'ВКЛ':'выкл';b.className=v?'on':''};u();b.onclick=run(()=>{it.s(!it.g());u()});row.append(sp,b)}
      if(it.t=='s'){const sp=document.createElement('span');const i=document.createElement('input');i.type='range';i.min=it.mn;i.max=it.mx;i.step=it.st;i.value=it.g();const u=()=>sp.textContent=it.l+': '+(+i.value);u();i.oninput=run(()=>{it.s(+i.value);u()});row.append(sp,i)}
    });
  }
  setInterval(()=>{if(P.style.display=='flex'){live.forEach(f=>f());P.querySelector('#modi').textContent='MOD · '+TABS[cur].n}},500);
  const open=()=>{P.style.display='flex';build()};
  mb.onclick=()=>{P.style.display=P.style.display=='flex'?'none':open()};
  P.querySelector('#modx').onclick=()=>P.style.display='none';
  P.querySelector('#modbig').onclick=()=>P.classList.toggle('big');
  /* свайп влево/вправо — смена вкладки */
  let sx=0,sy=0;
  P.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  P.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8){cur=(cur+(dx<0?1:TABS.length-1))%TABS.length;build()}},{passive:true});
  /* бесконечная ярость */
  setInterval(()=>{if(MOD.infRage&&rage&&rage[1].ch<3){rage[1].ch=3;rage[1].earned=3;hudRage()}},400);
  window.openAdm=open; /* 5 нажатий по заголовку открывают то же меню */
})();

/* ---- запуск ---- */
addEventListener('resize',resize);
applyCfg();applyLang();wireMenu();setupIntro();loop();
</script></body></html>
